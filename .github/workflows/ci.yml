name: CI

# The checks AGENTS.md lists. tests/test_ci_workflow.py pins what must not drift in this file.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every push to main finishes its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          package-manager-cache: false
      - run: uv sync --locked
      - name: Check
        run: uv run ruff check . && uv run ruff format --check . && env PYRIGHT_PYTHON_IGNORE_WARNINGS=1 uv run pyright && env PYTHONDONTWRITEBYTECODE=1 uv run pytest -q -n auto --dist loadgroup
      - name: Web check
        run: npm --prefix ui ci && npm --prefix ui run check
      - name: Stale-build check
        run: npm --prefix ui run build && test -z "$(git status --porcelain ui/dist)"
